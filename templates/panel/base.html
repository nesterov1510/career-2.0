<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Панель{% endblock %} · MSB Career</title>
<meta name="robots" content="noindex,nofollow">
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;
    --acc:#2f6fed;--acc-d:#1f5cd6;--soft:#eef3ff;--err:#d92d20;--err-bg:#fef3f2;
    --ok:#067647;--ok-bg:#ecfdf3;--warn:#b54708;--warn-bg:#fffaeb;--side:#0f1a33;--side-ink:#94a3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}

  .layout{display:flex;min-height:100vh}
  .side{width:222px;flex:none;background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .side .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:15px;padding:4px 10px 18px}
  .side .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff}
  .side .nav{display:flex;align-items:center;gap:10px;color:var(--side-ink);padding:10px 12px;border-radius:10px;font-weight:600}
  .side a.nav:hover,.side button.nav:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
  .side a.nav.on{background:var(--acc);color:#fff}
  .side .spacer{flex:1}
  .side form{margin:0}
  .side button.nav{width:100%;border:0;background:transparent;font:inherit;cursor:pointer}
  .side .out{font-size:13px;opacity:.8}
  .main{flex:1;padding:26px 30px;min-width:0}
  .main h1{font-size:22px;margin-bottom:4px}
  .main .sub{color:var(--muted);margin-bottom:22px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
  .card h2{font-size:16px;margin-bottom:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat .v{font-size:26px;font-weight:800}
  .stat .l{color:var(--muted);font-size:13px;margin-top:2px}
  .stat.blue .v{color:var(--acc)} .stat.green .v{color:var(--ok)} .stat.amber .v{color:var(--warn)}

  table{width:100%;border-collapse:collapse}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfc}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.new{background:var(--soft);color:var(--acc)}
  .pill.contacted{background:var(--warn-bg);color:var(--warn)}
  .pill.accepted{background:var(--ok-bg);color:var(--ok)}
  .pill.rejected{background:var(--err-bg);color:var(--err)}
  .pill.gray{background:#f2f4f7;color:var(--muted)}
  .pill.green{background:var(--ok-bg);color:var(--ok)}
  .pill.red{background:var(--err-bg);color:var(--err)}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;transition:.15s}
  .btn:hover{background:var(--acc-d);text-decoration:none;color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f2f4f7}
  .btn.red{background:var(--err)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}

  .field{margin-bottom:14px}
  .field label{display:block;font-weight:600;margin-bottom:6px}
  .field .hint{color:var(--muted);font-size:12.5px;margin-top:5px}
  input[type=text],input[type=password],input[type=url],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,111,237,.14)}

  .flash{padding:12px 16px;border-radius:11px;font-size:14px;margin-bottom:16px}
  .flash.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #abefc6}
  .flash.err{background:var(--err-bg);color:var(--err);border:1px solid #fecdca}

  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tbl-scroll{overflow-x:auto}

  @media(max-width:860px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
    .side .brand{padding:0 12px 0 0}
    .side .spacer{display:none}
    .main{padding:18px}
  }
</style>
</head>
<body>
<div class="layout">
  {% if logged %}
  <aside class="side">
    <div class="brand"><span class="dot">M</span> MSB Career</div>
    <a class="nav {{ 'on' if active == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}">📊 Дашборд</a>
    <a class="nav {{ 'on' if active == 'admin.sites' }}" href="{{ url_for('admin.sites') }}">💼 Сайты и вакансии</a>
    <a class="nav {{ 'on' if active and active.startswith('admin.app') }}" href="{{ url_for('admin.apps') }}">📥 Заявки</a>
    <a class="nav {{ 'on' if active and active.startswith('admin.settings') }}" href="{{ url_for('admin.settings') }}">⚙️ Настройки</a>
    <a class="nav" href="{{ url_for('index') }}" target="_blank" rel="noopener">↗ Открыть главную</a>
    <div class="spacer"></div>
    <form method="post" action="{{ url_for('admin.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="nav out" type="submit">🚪 Выйти</button>
    </form>
  </aside>
  {% endif %}
  <main class="main">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
